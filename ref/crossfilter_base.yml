  white_catalog:

imcoadd:
  input_images:
  runtime_version:
  coadd_routine: 'direct'
  coadd_mode: 'proper'
  coadd_weighting: global
  coadd_options:
    clipped:
      clip_sigma: 5.0
      clip_ampfrac: 0.3
