name:

process_id:

sanity:

flag:
  white_coadd: false
  phot7ds: false
  white_photometry: false

info:
  file:
  project: 7DT/7DS
  creation_version:
  runtime_version:
  creation_datetime:
  last_update_datetime:

settings:
  is_too: false
  is_pipeline: false
  is_multi_epoch: false
  sanity_from_db: true
  config_suffix:
  factory_scratch:

logging:
  level: INFO
  file:
  format: '[%(levelname)s] %(asctime)s - %(name)s - %(message)s'
  handlers:
    - console
    - file

input:
  science_configs:
  expected_coadd_images:
  coadd_images:
  filters:
  used_filters:
  sanity_rejected_science_configs:
  missing_coadd_images:
  source_raw_images:
  discovery_method:
  discovery_datetime:
  parents_changed: false
  minimum_filters: 3
  output_dir:
  white_image:
  white_catalog:

# imcoadd and photometry inherit sciproc_base.yml (pipeline.config.utils.crossfilter_template); list only crossfilter overrides here
imcoadd:
  coadd_routine: 'direct'  # source coadds already share the SWarp grid: no reprojection
  coadd_mode: 'proper'
  coverage_policy: intersection  # white pixels only where every source coadd contributes
  match_swarp_size: false
  image_selection_source: db
  interpolate_badpix: false  # source coadds carry no bad pixel mask to interpolate
  output_mask_map: false  # BADPIX/SATURATED bits come from a detector bpmask; source coadds have none
  convolve: false

phot7ds:
  runtime_version:
  catalog:

photometry:
  use_weight_map: true
