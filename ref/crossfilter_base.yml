  dump_unreprojected_interp: false
  dump_unreprojected_weight: false
  intermediate_policy: auto
  memory_image_limit: 6
  dump_bkgsub: false
  lean_factory: false
  combine_lock_threshold: 20
  combine_scratch: auto
  convolve: false
  target_seeing:

