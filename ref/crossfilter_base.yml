    BACK_FILTERSIZE:
    DETECT_THRESH:
    DETECT_MINAREA:
  source_mask: true
  output_weight_map: true
  output_single_weight_map: false
  output_footprint: true
  output_mask_map: true
  dump_reprojected_masks: false
  satellite_mask:
    enabled: false
    bin_factor: 4
    background_box: 65
    star_clip_sigma: 3.0
    low_sigma: 2.0
    high_sigma: 8.0
    canny_sigma: 1.0
    canny_low_threshold: 0.157
    canny_high_threshold: 0.471
    theta_step: 0.25
    hough_threshold: 50
    min_length_fraction: 0.08
    max_gap: 20
    merge_angle: 1.0
    merge_distance: 12.0
    min_support_fraction: 0.08
