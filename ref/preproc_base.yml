name: 

process_id:

info:
  file:
  project: 7DT/7DS
  creation_version:
  runtime_version:
  creation_datetime:
  last_update_datetime:

logging:
  level: INFO
  file: 
  format: '[%(levelname)s] %(asctime)s - %(name)s - %(message)s'
  handlers:
    - console
    - file

preprocess:
  max_offset: 300
  n_sigma: 5  # bad pixel mask criterion
  n_head_blocks: 8
  use_multi_device: False
  use_multi_thread: False
  device: 
  ignore_sanity_if_no_match: true
  ignore_lenient_keys_if_no_match: true
  reprocess_on_better_match: false  # also rebuild when a closer master is now available, not just when one was regenerated
  designated_masterframes:  # manual override instead of generation/search; master/science frames that did not use these are rebuilt
    # - dark: /path/dark_100s_...fits      # sci-dark role ONLY -> flatdark falls back to the normal search
    # - flatdark: /path/dark_3s_...fits    # flatdark ONLY -> sci-dark role stays automatic
    # - /path/dark_100s_...fits            # plain: both roles


settings:
  is_too: false
  is_pipeline: true  # keep it true. preprocess is assumed to be pipeline

input: 
  masterframe_images: 
  science_images: 
  grouped_raw_images:
  raw_dir: 