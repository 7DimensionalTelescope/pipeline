flag:
  # configuration: false
  # preprocess: false
  astrometry: false
  single_photometry: false
  coadd: false
  # joint_astrometry: false
  coadd_photometry: false
  subtraction: false
  difference_photometry: false

info:
  file:
  project: 7DT/7DS
  creation_version:
  runtime_version:
  creation_datetime:
  last_update_datetime:

settings:
  is_too: false
  is_pipeline: false
  is_multi_epoch: false
  obsmode:  # Deep Spec Color Search Single
  coadd: True
  sanity_from_db: True  # SANITY filter from image_qa (one query); False reads every header
  factory_scratch:  # local root for multi-epoch factories (fast disk); empty = FACTORY_DIR on NFS
  factory_scratch_cap_gb: 1200  # rotate oldest idle scratch trees above this total
  gpu_enabled: True
  verbose_gpu: True  # use logger later
  
logging:
  level: INFO
  file: 
  format: '[%(levelname)s] %(asctime)s - %(name)s - %(message)s'
  handlers:
    - console
    - file

# qa:
#   pa:
#   ellipticity:
#   seeing:

input: 
  calibrated_images: 
  processed_dir:
  coadd_image:
  difference_image:

astrometry:
  input_images:
  runtime_version:
  eval_match_radius: 5.0  # 10.0  # arcsec
  path:
    ref_ris_dir: "/lyman/data1/factory/catalog/gaia_dr3_7DT"
    ref_query_dir: "/lyman/data1/factory/ref_scamp"
  ahead_file: "/data/pipeline_reform/dhhyun_lab/scamptest/ahead/calib_7DT11_T07304_20250115_050155_g_60_nocrval.ahead"
  local_astref: 
  scamp_timeout: auto  # auto or seconds. auto starts from 60s and goes up to 300s for dense fields
  solvefield_timeout: 60  # seconds

photometry:
  input_images:
  runtime_version:
  use_weight_map: False  # attach <image>_weight.fits as MAP_WEIGHT; off = historical weightless photometry
  ref_cat:  # for RIS tiles
  query_radius: 1.0  # deg
  match_radius: 1.0  # arcsec
  photfraction: 0.75
  refcatname: GaiaXP
  refqueryradius: 0.9
  ref_mag_lower: 12
  ref_mag_upper: 17.5
  ref_mag_err_upper: 0.05
  flagcut: 0
  check: False
  filters_to_check:
  satur_margin: 0.99  # factor multiplied to the propagated hardware upper limit
  sex_vars:
    PHOT_APERTURES:
    PHOT_AUTOPARAMS:
    DETECT_MINAREA: 5
    DETECT_THRESH: 3.0
    DEBLEND_NTHRESH: 64
    DEBLEND_MINCONT: 0.0001
    BACK_SIZE: 64
    BACK_FILTERSIZE: 3
    BACKPHOTO_TYPE: LOCAL

imcoadd:
  input_images:
  runtime_version:
  coadd_routine: 'legacy'  # legacy or reproject-first
  coadd_mode: 'median'  # mean | median | clipped (two-pass 3-sigma clipped weighted mean)
  coadd_weighting: global  # false | global (1/SKYSIG^2 per image) | pixel-wise (weight maps)
  image_selection: false  # False, 'auto' or 'interactive'; multi-epoch only
  image_selection_cuts:  # pinned cuts, e.g. {seeing: '<=2.8', bin2fwhm: '<=5.6'}; rest automatic
  image_selection_source: db  # 'db' (image_qa, one query) or 'headers' (read every file)
  ppflag_bitmask: '110000'  # one digit per PPFLAG bit:'110100' tolerates bits 1, 2 and 8.
  coadd_image:  # output coadd image
  gpu: True
  device: 0
  zp_key: 'ZP_AUTO'
  zpscale: True
  bkgsub_type:  # 'constant' | 'dynamic' | 'individual'; leave empty for auto
  sex_vars:  # SExtractor overrides for background subtraction
    BACK_SIZE:
    BACK_FILTERSIZE:
    DETECT_THRESH:  # empty reuses the photometry catalog; a differing value forces own run
    DETECT_MINAREA:
  source_mask: True  # False, True or 'iterative'; only affects dynamic bkgsub
  output_weight_map: true  # write the coadd weight product
  output_single_weight_map: false  # keep each frame's resampled weight in singles/ (int16)
  output_footprint: true  # write the coadd footprint product
  output_sky_rms_map: false  # BACKGROUND_RMS model of source-free sky
  output_bkg_map: false  # keep each frame's mesh background model (262 MB/frame, read by nobody)
  persist_weight_maps: False  # durable per-single maps; costs 1.71 s/frame to save a 0.04 s kernel
  joint_wcs: False
  interpolate_badpix: False  # interpolate bad pixels in the sci frames (was apply_bpmask)
  interp_type: 'median'
  zero_badpix_weight: True  # set weight to 0 for bad pixels
  badpix_reprojection_policy: 1px  # off | 1px | conservative (resamp kernel size): how many weight pixels to zero out
  streamline_reprojection: true  # (interp + weight + reproject) in one go, per-image; less I/O
  discard_interp: true  # delete interp pairs once their reprojected products exist
  lean_factory: False  # delete sci resamps + bkg/bkgrms once bkgsub products exist; resumes recompute
  combine_lock_threshold: 20  # combines with >= this many inputs take the per-filesystem flock
  combine_scratch: auto  # local dir to stage combine inputs off NFS; 'auto' picks one only when the inputs are on a network fs and the combine is >= combine_lock_threshold frames; empty = off (moot when factory_scratch set)
  convolve: 
  target_seeing:  # auto if it's empty or smaller than max seeing

imsubtract:
  input_image:
  runtime_version:
  reference_image:
  # input_mask:
  # template_mask: