# Kernel VM tuning for the 7DT pipeline host (Proton: 503 GB RAM, 128 cores, NFS-backed).
# Install:  sudo cp 99-pipeline-tuning.conf /etc/sysctl.d/ && sudo sysctl --system
# Verify:   sysctl vm.min_free_kbytes vm.watermark_scale_factor
#
# Symptom this fixes: during the nightly bulk-processing window, `sar -B` showed
# pgscand/s (DIRECT reclaim scan rate) sustained at 60,000-140,000 pages/s. Direct
# reclaim is synchronous — the allocating process blocks to free memory itself, which
# is felt as multi-hundred-ms stalls in Python imports and array allocation.
#
# Cause: the defaults are sized for small machines. With ~419 GB of page cache from
# streaming FITS I/O and 128 cores allocating concurrently, free memory crossed from
# the low watermark to the min watermark faster than kswapd could respond.

# Min watermark: below this, allocations are forced into direct reclaim.
# Default here was 91910 KB (90 MB) of headroom on a 503 GB machine.
# 4 GB = 0.8% of RAM. Do not raise far beyond this: an excessive value can cause
# premature OOM kills.
vm.min_free_kbytes = 4194304

# Distance between the min/low/high watermarks, in 1/10000ths of a zone (default 10 =
# 0.1%). At 200 (2%) kswapd wakes earlier and frees a larger buffer per pass, so bursts
# are absorbed by background reclaim instead of falling through to direct reclaim.
vm.watermark_scale_factor = 200

# Swap: keep the default low tendency. Note this host also needs the swap *priority*
# corrected (a 16 GB partition at priority -2 fills before the 1 TB swapfile at -3);
# that is a swapon change, not a sysctl. See README "Host tuning".
vm.swappiness = 10
