# /tmp is wiped at reboot; auto recreate
# Age "-": never expire it in the daily sweep.
d /tmp/pipeline 2775 pipeline-stable pipeline -

# THP defrag: "defer" never compacts synchronously in the faulting task; kcompactd does it in the background.
# Measured 2026-10-09 on proton: under "madvise" 745 compaction stalls / 30 s, 76% of them failing, PSI memory
# full avg10 67%; under "defer" 0 stalls, PSI 2%, and 94x MORE huge pages actually allocated (fragmentation had
# left no free 2 MB blocks, so every madvised fault stalled and usually got 4 KB pages anyway).
# Not a sysctl (/sys, not /proc/sys), so it cannot live in 99-pipeline-tuning.conf.
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer
